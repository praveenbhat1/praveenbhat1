name: Profile assets

on:
  schedule:
    - cron: "0 0 * * *"   # refresh once a day
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        run: mkdir -p dist && python scripts/build_stats.py dist/stats.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6F59&color_dots=#1C1D1D,#5A2E27,#8F3F33,#C85544,#FF6F59
            dist/snake-light.svg?color_snake=#FF6F59&color_dots=#EBEDF0,#FCD3CA,#F9A898,#F58570,#FF6F59

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
