<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-labelledby="t">
  <title id="t">Sowkur Praveen Bhat, AI Engineer and Full-Stack Developer</title>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1C1D1D" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#121313" stop-opacity="1"/><stop offset=".55" stop-color="#121313" stop-opacity=".2"/><stop offset="1" stop-color="#121313" stop-opacity=".9"/></linearGradient>
  </defs>
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .cur{animation:b 1s steps(1) infinite}
    .in{opacity:0;animation:f .6s ease-out forwards}
    @keyframes b{50%{opacity:0}} @keyframes f{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.cur,.in{animation:none;opacity:1}}
  </style>
  <rect width="820" height="230" rx="12" fill="#121313"/>
  <rect width="820" height="230" rx="12" fill="url(#g)"/>
  <rect width="820" height="230" rx="12" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="819" height="229" rx="12" fill="none" stroke="#2A2B2B"/>

  <text x="40" y="58" class="m" font-size="13" fill="#FF6F59">praveenbhat.dev</text>
  <text x="40" y="112" class="s" font-size="44" font-weight="700" fill="#F3E9D2" letter-spacing="-1">Sowkur Praveen Bhat</text>
  <text x="40" y="146" class="s" font-size="18" fill="#9C9588">AI Engineer and Full-Stack Developer</text>
  <text x="40" y="190" class="m" font-size="12.5" fill="#6F6A62">Udupi, India   /   NMAMIT '27   /   open to full-time roles</text>

  <line x1="560" y1="44" x2="560" y2="190" stroke="#2A2B2B"/>
  <g class="s">
    <g class="in" style="animation-delay:.3s"><text x="588" y="72" font-size="24" font-weight="700" fill="#FF6F59">91.1% mA</text>
